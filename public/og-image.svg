    <text x="130" y="82" fill="#90e0ef" font-family="Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="4">MEDICAL</text>
  </g>

  <g transform="translate(84 225)">
    <text x="0" y="0" fill="#ffffff" font-family="Arial, sans-serif" font-size="55" font-weight="700">Maritime medical clarity,</text>
