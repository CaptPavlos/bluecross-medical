<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">BlueCross Medical social preview</title>
  <desc id="desc">BlueCross Medical branding with a ship, medical cross, and the message Maritime medical clarity, from flag to first response.</desc>
  <defs>
