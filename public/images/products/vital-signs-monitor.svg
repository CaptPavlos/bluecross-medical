<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">Illustration of a portable vital signs monitor</title>
  <desc id="desc">A clearly illustrative pocket monitor showing an ECG trace, oxygen saturation, and heart rate.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#071426"/><stop offset="1" stop-color="#123c63"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#edfaff"/><stop offset="1" stop-color="#c9f3fb"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-opacity=".35"/></filter>
  </defs>
  <rect width="800" height="450" rx="28" fill="url(#bg)"/>
  <circle cx="92" cy="78" r="138" fill="#0077b6" opacity=".16"/>
  <circle cx="718" cy="394" r="170" fill="#48cae4" opacity=".1"/>
  <path d="M0 360c150-45 260 46 408 8 154-40 254-78 392-20v102H0z" fill="#071426" opacity=".58"/>
  <g filter="url(#shadow)" transform="translate(279 63)">
    <rect width="242" height="310" rx="42" fill="#f7fbfd"/>
    <rect x="18" y="23" width="206" height="220" rx="25" fill="url(#screen)" stroke="#a8dbe8" stroke-width="3"/>
    <text x="38" y="61" fill="#28516b" font-family="Arial, sans-serif" font-size="14" font-weight="700">VITALS</text>
    <text x="175" y="61" fill="#0077b6" font-family="Arial, sans-serif" font-size="13" font-weight="700">LIVE</text>
    <path d="M37 115h31l10-18 15 52 17-73 20 65 13-26h60" fill="none" stroke="#e63946" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="37" y1="165" x2="203" y2="165" stroke="#9ed8e7" stroke-width="2"/>
    <text x="38" y="202" fill="#0a1628" font-family="Arial, sans-serif" font-size="38" font-weight="700">98</text>
    <text x="88" y="202" fill="#36637b" font-family="Arial, sans-serif" font-size="15">SpO₂</text>
    <text x="146" y="202" fill="#0a1628" font-family="Arial, sans-serif" font-size="38" font-weight="700">72</text>
    <text x="184" y="222" fill="#36637b" font-family="Arial, sans-serif" font-size="12">bpm</text>
    <circle cx="121" cy="274" r="17" fill="#0077b6"/>
    <path d="M113 274h16M121 266v16" stroke="white" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g transform="translate(48 319)">
    <rect width="198" height="62" rx="18" fill="#ffffff" opacity=".94"/>
    <path d="M26 31c8-15 20-15 28 0 8-15 20-15 28 0" fill="none" stroke="#e63946" stroke-width="4" stroke-linecap="round"/>
    <text x="96" y="28" fill="#0a1628" font-family="Arial, sans-serif" font-size="14" font-weight="700">POCKET VITALS</text>
    <text x="96" y="45" fill="#526a7a" font-family="Arial, sans-serif" font-size="11">BRANDED ILLUSTRATION</text>
  </g>
</svg>
