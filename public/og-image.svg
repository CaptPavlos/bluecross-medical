      <stop stop-color="#071426"/><stop offset=".55" stop-color="#123b61"/><stop offset="1" stop-color="#006f9f"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#0077b6"/><stop offset="1" stop-color="#48cae4"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020913" flood-opacity=".42"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1060" cy="70" r="270" fill="#48cae4" opacity=".09"/>
  <circle cx="1040" cy="82" r="174" fill="#48cae4" opacity=".07"/>
  <circle cx="92" cy="601" r="300" fill="#0077b6" opacity=".13"/>
  <path d="M0 500c168-52 299 57 459 14 178-48 299-85 474-21 102 38 178 27 267-5v142H0z" fill="#071426" opacity=".72"/>
  <path d="M0 533c169-49 298 57 459 14 177-48 299-85 474-21 102 37 178 26 267-5" fill="none" stroke="url(#sea)" stroke-width="11" opacity=".9"/>

  <g transform="translate(84 72)">
